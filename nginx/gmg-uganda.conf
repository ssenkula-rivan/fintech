# GMG Uganda - Nginx Configuration (Monolith Architecture)
# Place this file in: /etc/nginx/sites-available/gmg-uganda.conf
# Enable with: ln -s /etc/nginx/sites-available/gmg-uganda.conf /etc/nginx/sites-enabled/
# Test with: nginx -t
# Reload with: systemctl reload nginx

# Upstream backend (monolith API)
upstream gmg_api {
    server api:3010;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=transaction_limit:10m rate=30r/m;

# API Gateway - api.gmguganda.com
server {
    listen 80;
    listen 443 ssl http2;
    server_name api.gmguganda.com localhost;

    # SSL Configuration (uncomment for production)
    # ssl_certificate /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS Headers - Restrict to known origins in production
    # For development, use specific localhost origins
    # For production, replace with your actual domains
    set $cors_origin "";
    if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$") {
        set $cors_origin $http_origin;
    }
    if ($http_origin ~* "^https?://(app\.gmguganda\.com|api\.gmguganda\.com)$") {
        set $cors_origin $http_origin;
    }
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # Logging
    access_log /var/log/nginx/gmg-api-access.log;
    error_log /var/log/nginx/gmg-api-error.log;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Auth endpoints (stricter rate limiting)
    location /api/auth {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://gmg_api;
        include /etc/nginx/proxy_params.conf;
    }

    # Transaction endpoints (moderate rate limiting)
    location /api/transactions {
        limit_req zone=transaction_limit burst=10 nodelay;
        proxy_pass http://gmg_api;
        include /etc/nginx/proxy_params.conf;
    }

    # Wallet endpoints
    location /api/wallet {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gmg_api;
        include /etc/nginx/proxy_params.conf;
    }

    # Trading endpoints
    location /api/trading {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gmg_api;
        include /etc/nginx/proxy_params.conf;
    }

    # Crypto wallet endpoints
    location /api/crypto-wallet {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gmg_api;
        include /etc/nginx/proxy_params.conf;
    }

    # KYC endpoints
    location /api/kyc {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://gmg_api;
        include /etc/nginx/proxy_params.conf;
    }

    # Webhooks (no rate limiting - external callbacks)
    location /api/webhooks {
        proxy_pass http://gmg_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # All other API endpoints
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gmg_api;
        include /etc/nginx/proxy_params.conf;
    }

    # Health check (no rate limiting)
    location /health {
        access_log off;
        proxy_pass http://gmg_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Root API info
    location = / {
        proxy_pass http://gmg_api;
        include /etc/nginx/proxy_params.conf;
    }
}

# Frontend Application - app.gmguganda.com
server {
    listen 80 default_server;
    listen 443 ssl http2;
    server_name app.gmguganda.com www.gmguganda.com _;

    # SSL Configuration (uncomment for production)
    # ssl_certificate /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Document root
    root /var/www/html;
    index index.html;

    # Logging
    access_log /var/log/nginx/gmg-app-access.log;
    error_log /var/log/nginx/gmg-app-error.log;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy (for same-origin requests)
    location /api/ {
        proxy_pass http://gmg_api;
        include /etc/nginx/proxy_params.conf;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML files (no cache)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Manifest and service worker
    location ~* (manifest\.json|sw\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
